# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# DO-NOT-EDIT. This file was auto-generated using github:mightyiam/files.
# Use `nix run .#write-files` to regenerate it.
jobs:
  integrate:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: setup
      uses: JRMurr/direnv-nix-action@v4.2.0
      with:
        cache-store: true
        install-nix: true
    - name: check flake.lock
      run: nix flake lock --no-update-lock-file
    - name: build
      run: nix build github:srid/devour-flake --no-link --show-trace --override-input
        flake .
    strategy:
      fail-fast: true
      matrix:
        include:
        - os: macos-latest
          system: aarch64-darwin
        - os: ubuntu-24.04-arm
          system: aarch64-linux
        - os: ubuntu-latest
          system: x86_64-linux
        system:
        - aarch64-darwin
        - aarch64-linux
        - x86_64-linux
name: Integration V2
'on':
  push:
    branches:
    - master
    - trunk
